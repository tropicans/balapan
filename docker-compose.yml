services:
  dgdash-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dgdash-racing-system:latest
    container_name: dgdash-racing-system
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3050}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/tamiya.sqlite
    volumes:
      - dgdash_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dgdash_data:
    driver: local
    name: dgdash_racing_data
